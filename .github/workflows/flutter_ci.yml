name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
            - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Create admin config
        run: |
          mkdir -p lib/config
          cat > lib/config/admin_config.dart << 'EOF'
          class AdminConfig {
            static const String adminEmail = String.fromEnvironment('ADMIN_EMAIL', defaultValue: '');
            static const String adminPassword = String.fromEnvironment('ADMIN_PASSWORD', defaultValue: '');
          }
          EOF
        
      - name: Run analyzer
        run: flutter analyze
        
      - name: Run tests
        run: flutter test
